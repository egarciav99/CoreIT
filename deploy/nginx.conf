server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La configuración nunca se cachea: los cambios se ven al recargar.
    location = /config.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # En nginx, un add_header dentro de location anula los del server: por eso se incluyen también arriba.
    include /etc/nginx/conf.d/security-headers.inc;
}
